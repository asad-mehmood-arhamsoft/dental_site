version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dental_postgres
    environment:
      POSTGRES_DB: dental_clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dental_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dental_clinic
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai-service:5000
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run migrate && npm run dev"

  ai-service:
    build: ./ai-service
    container_name: dental_ai_service
    environment:
      PORT: 5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      USE_OPENROUTER: ${USE_OPENROUTER:-false}
      MODEL_NAME: ${MODEL_NAME:-gpt-3.5-turbo}
    ports:
      - "5000:5000"
    volumes:
      - ./ai-service:/app

  frontend:
    build: ./frontend
    container_name: dental_frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
